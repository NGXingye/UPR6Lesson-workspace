# 版本库治理。改仓库边界或提交白名单时先改本文件。
# 提交与推送走 tools/git_guard.ps1。禁止 Git Credential Manager / Google 浏览器授权。
# 游标 project_cursor.yml 不进库。

control_plane:
  root: E:/unity-p/UPR6Lesson-workspace
  remote: git@github.com:NGXingye/UPR6Lesson-workspace.git
  protocol: ssh
  oauth_browser: forbidden
  deploy_key_local: ~/.ssh/upr6_github
  deploy_key_title: upr6-local
  commit_tool: tools/git_guard.ps1
  deny:
    - project_cursor.yml
    - Library/
    - Temp/
    - Logs/

source_project:
  root: E:/unity-p/UPR6Lesson
  status: not_in_git
  push: forbidden_until_layout_ready
  note: 先搭 Assets 骨架。TerrainData 进 Content/static/terrain；GeneratedTerrain 不入库；光照跟场景同目录。

source_allow_when_ready:
  - ProjectSettings/
  - Packages/manifest.json
  - Packages/packages-lock.json
  - Assets/Settings/
  - Assets/Scripts/
  - Assets/Shaders/
  - Assets/Content/
  - Assets/Content/static/scenes/
  - Assets/Content/static/terrain/
  - Assets/FFTOcean/script/
  - Assets/FFTOcean/shader/
  - Assets/FFTOcean/Editor/
  - Assets/FFTOcean/Config/
  - Assets/_TA_Battlefield/Art/Script/
  - Assets/_TA_Battlefield/Art/shader/
  - Assets/_TA_Battlefield/Art/GrassConfig/
  - Assets/_TA_Battlefield/Scenes/

source_deny:
  - Library/
  - Temp/
  - Logs/
  - obj/
  - UserSettings/
  - "*.csproj"
  - "*.sln"
  - "*.slnx"
  - Assets/_TA_Battlefield/Art/GeneratedTerrain/
  - Assets/_TA_Battlefield/Art/Terrain/Data/
  - Assets/Art/park/
  - Assets/Art/Incoming/
